
name: Build Buku Kas Pembangunan

on:
  workflow_dispatch:
  push:
    paths:
      - 'BukuKasPembangunan_CloudBuild_HP.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ekstrak source
        run: unzip -o BukuKasPembangunan_CloudBuild_HP.zip -d source

      - name: Samakan target Java ke 17
        run: |
          cat >> source/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Build APK
        run: |
          cd source
          gradle assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Buku-Kas-Pembangunan-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
